name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # CI never needs paid keys or network access (CLAUDE.md, non-negotiable 6).
      ROUTER_BACKEND: fallback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,ui,eval]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Generate synthetic data
        run: python scripts/generate_data.py
      - name: Tests
        run: pytest
      - name: Evaluation gates (guardrail recall, false refusals, violation detection)
        run: python eval/run_eval.py ci

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t benefitpilot .
