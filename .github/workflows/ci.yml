name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # CI never needs paid keys or network access (CLAUDE.md, non-negotiable 6).
      ROUTER_BACKEND: fallback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,ui]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Generate synthetic data
        run: python scripts/generate_data.py
      - name: Tests
        run: pytest
      # Phase 7 adds: guardrail red-team gate (fails below 98% recall) and a small eval.

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t benefitpilot .
