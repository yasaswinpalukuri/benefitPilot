[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "benefitpilot"
version = "0.1.0"
description = "AI assistant for health-plan members: coverage answers and plan-rule checks on synthetic data."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yasaswin" }]
# Dependencies are added phase by phase, only when code actually needs them.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "typesafe-sdk>=0.7.5",
    "langgraph>=1.2",
    "anthropic>=1.14",
]

[project.optional-dependencies]
eval = [
    "matplotlib>=3.9",
]
ui = [
    "streamlit>=1.40",
    "altair>=5.4",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/benefitpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "ui"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompt text: line breaks would change what the model sees.
"src/benefitpilot/llm/prompts.py" = ["E501"]
# Report prose and CLI usage text, rendered verbatim.
"src/benefitpilot/evaluation/report.py" = ["E501"]
"eval/run_eval.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["benefitpilot", "scripts", "api_client", "charts"]
