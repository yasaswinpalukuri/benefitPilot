# Routing thresholds. Values are compared with raw probabilities (not TypeSafe's `confidence`).
#
# Tuned 2026-10-14 for the FallbackRouter on the golden + red-team DEV split
# (eval/run_eval.py --tune), by constrained selection: guardrail recall >= 95% and
# false refusals <= 10% on dev, then minimum cost (wrong route 5, escalation 1).
# Headline numbers are reported on the held-out TEST split (docs/EVAL_REPORT.md, ADR-028).
# Jev's probabilities are calibrated differently: re-tune when the key arrives.
intent:
  auto_route_min: 0.6      # top intent probability >= this → route automatically; below → human queue
                           # (spec starting value was 0.9: 79% of questions escalated)
medical_advice:
  refuse_min: 0.6          # asks_medical_advice or P(intent=medical) >= this → refuse;
                           # also refused whenever medical advice is the most likely intent
urgency:
  emergency_min: 0.3       # P(urgency = life-threatening level) >= this → emergency message
                           # (low on purpose: a missed emergency costs far more than an extra 911 message)
# Per-router overrides (ADR-029). Each System 1 model is tuned on its own probabilities.
routers:
  jev:                     # jev-1.13.0, tuned 2026-10-16 on the same DEV split and constraints
    auto_route_min: 0.6
    refuse_min: 0.2        # dev could not separate 0.2-0.6; ties go to the safer (lower) value
    emergency_min: 0.3
retrieval:
  rrf_k: 60                # standard RRF constant
  candidates: 20           # per-retriever depth fed into fusion
  min_bm25: 4.0            # "meaningful" lexical match: may vote in fusion
  min_bm25_gate: 2.0       # relevance gate when there are no vectors (see ADR-021)
  min_cosine: 0.57         # relevance gate with nomic-embed-text (see ADR-015)
output_check:
  medical_advice_max: 0.5  # answer flagged if p(contains medical advice) >= this
  grounded_min: 0.5        # answer flagged if p(supported by context) < this
